<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub 原地放下 · 对照</title><style>body{margin:24px;background:#202323;color:#dde0df;font:15px/1.6 system-ui}a{color:#c1d4d0}button{background:#373d3d;color:inherit;border:1px solid #778080;border-radius:8px;padding:10px}main{display:flex;gap:20px;flex-wrap:wrap}section{flex:1;min-width:290px}video{width:100%;max-height:75vh;background:#171b1b}h1{font-size:24px}</style><h1>原地放下：同一球体，同一菜单</h1><p>拖到中部 → 松手 → 展开扇形 → 原生社交入口 → 切换网格 → 关闭。相同操作脚本、视口、等待及1×播放；独立录制不保证逐帧同步，不用于推断性能。</p><p><a href="index.html?variant=baseline">操作现役对照</a> · <a href="index.html?variant=free">操作自由放置</a> · <button id="play">从头同时播放</button> · <button id="size">切换390 / 1280视口</button></p><p id="state"></p><main><section><h2>现役：松手回侧边</h2><video id="baseline" controls muted playsinline></video></section><section><h2>研究：松手停在当前位置</h2><video id="free" controls muted playsinline></video></section></main><p>没有加入惯性漂移、蓄力或新等待。主动停靠与找回仍保留。旧Claude方案中的球体本身仍吸边；自由位置是负责人要求的适配，不冒称原作功能。仅研究预览，未进入产品。</p><script type="module">
const run=new URLSearchParams(location.search).get('run'),videos=[...document.querySelectorAll('video')];let width=1280;
function load(){document.querySelector('#state').textContent=`${width} × 900，原速`;if(!/^\d+$/.test(run??'')){document.querySelector('#state').textContent='请先运行 record.mts 并打开输出的链接。';return}for(const v of videos)v.src=`/tests/artifacts/evo42-hub-direct/${run}/${width}-${v.id}.webm`}
document.querySelector('#play').onclick=()=>{for(const v of videos){v.currentTime=0;v.playbackRate=1;v.play().catch(()=>{})}};document.querySelector('#size').onclick=()=>{width=width===1280?390:1280;load()};load();
</script></html>
