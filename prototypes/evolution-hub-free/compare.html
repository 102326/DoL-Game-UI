<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub 边缘弹射 · 对照</title><style>body{margin:24px;background:#202323;color:#dde0df;font:15px/1.6 system-ui}a{color:#c1d4d0}button{background:#373d3d;color:inherit;border:1px solid #778080;border-radius:8px;padding:10px}main{display:flex;gap:20px;flex-wrap:wrap}section{flex:1;min-width:290px}video{width:100%;max-height:75vh;background:#171b1b}h1{font-size:24px}</style><h1>自由放置＋边缘蓄力</h1><p>普通拖放 → 持续顶边 → 沿边瞄准 → 松手 → 展开菜单 → 原生入口。相同操作脚本、视口、等待及1×播放；独立录制不保证逐帧同步，不用于推断性能。</p><p><a href="index.html?variant=direct">操作自由放置对照</a> · <a href="index.html?variant=free">操作边缘弹射候选</a> · <button id="play">从头同时播放</button> · <button id="size">切换390 / 1280视口</button></p><p id="state"></p><main><section><h2>对照：只做自由放置</h2><video id="direct" controls muted playsinline></video></section><section><h2>候选：持续顶边可以弹射</h2><video id="free" controls muted playsinline></video></section></main><p>短碰边不弹射，持续顶边才蓄力。飞行中点击接住，下一次点击开菜单。原作在编辑态提供边缘蓄力；此处保留现役球体与菜单，适配到日常自由放置。有限飞行、可随时打断，减少动态不弹射。仅隔离原型，未正式整合。</p><script type="module">
const run=new URLSearchParams(location.search).get('run'),videos=[...document.querySelectorAll('video')];let width=1280;
function load(){document.querySelector('#state').textContent=`${width} × 900，原速`;if(!/^\d+$/.test(run??'')){document.querySelector('#state').textContent='请先运行 record.mts 并打开输出的链接。';return}for(const v of videos)v.src=`/tests/artifacts/evo42-hub-edge/${run}/${width}-${v.id}.webm`}
document.querySelector('#play').onclick=()=>{for(const v of videos){v.currentTime=0;v.playbackRate=1;v.play().catch(()=>{})}};document.querySelector('#size').onclick=()=>{width=width===1280?390:1280;load()};load();
</script></html>
