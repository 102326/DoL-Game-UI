</style><main id="study"><h1>Hub：自由放置与边缘弹射</h1><p id="mode" role="status"></p><a href="?variant=direct">仅自由放置</a> <a href="?variant=free">加入边缘弹射</a> <a href="?variant=baseline">现役吸边</a> <button id="restore">找回工具</button> <label>菜单 <select id="layout"><option value="fan">扇形</option><option value="grid">网格</option></select></label><section><h2>轻放，或者蓄力再出发</h2><p class="reading">普通拖动后松手，球停在原地。把球继续顶向屏幕边缘并稍作停留，会出现蓄力环；沿边移动可瞄准，松手弹射。短暂碰边不会弹出。</p><p class="reading">飞行中点一下接住，再点才展开菜单；也可以重新抓住继续拖。Escape取消，主动停靠与找回仍保留。减少动态时只做直接放置。</p><div id="overlayButtons"><div class="sidebarButtonSplit"><button class="link-internal" data-native>存档</button></div><button class="link-internal macro-button" data-native>社交</button><button class="link-internal macro-button" data-native>属性</button></div><p id="notice" role="status">尚未操作</p></section><p class="reading">隔离研究，使用现役球体与菜单。游戏入口为计数夹具；偏好保存在独立研究区，不改正式设置。边缘交互参考Claude原方案的编辑态，适配为无需进入编辑器即可操作；未正式整合。</p></main><script type="module" src="./main.ts"></script></html>
