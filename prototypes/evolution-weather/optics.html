<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原生背景滤镜可行性实验</title><style>:root{color-scheme:dark;font:14px system-ui;background:#141b22;color:#d8e3e8}body{padding:40px}button{margin:15px;padding:10px}#glass{isolation:isolate;position:relative;width:760px;height:300px;overflow:hidden;background:#11202d40;border:1px solid #abc5c966;border-radius:22px}.backdrop{z-index:-1;position:absolute;inset:0;background:repeating-linear-gradient(110deg,#5e4c36 0px,#8d724c 13px,#182f3c 15px,#396579 27px)}canvas{position:absolute;inset:0;width:100%;height:100%}.evo-material-window{position:absolute;left:0;top:80px;width:100%;height:140px}p{max-width:760px;line-height:1.8}</style><link rel="stylesheet" href="./style.css"><body><h1>原生背景滤镜：实际像素实验</h1><p>背景是普通DOM上的CSS条纹。这里不把DOM转成Canvas纹理；水珠中的提亮/模糊由浏览器的背景滤镜产生。滤镜变化不是物理折射模型。</p><button id="toggle">切换背景滤镜</button><div id="glass"><div class="backdrop"></div><div class="evo-material-window"></div><canvas></canvas></div><script type="module">import{weatherSurface}from'./renderer';window.optics=weatherSurface(document.querySelector('canvas'),()=>({kind:'rain',night:false,rain:'normal'}),'beads');let enabled=true;document.querySelector('#toggle').onclick=()=>{enabled=!enabled;document.querySelectorAll('.evo-attached-drop').forEach(n=>n.style.backdropFilter=enabled?'':'none')};</script></body></html>
