<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湿玻璃 · 材质近景</title><style>
:root{color-scheme:dark;background:#10171b;color:#d4e0e1;font:14px system-ui}body{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-weight:450;font-size:30px}p{color:#9eb1b6;line-height:1.9}button,a{font:inherit;color:#c9dedf}button{border:1px solid #b4d5d32b;border-radius:9px;background:#d0eeee0b;padding:9px 15px;cursor:pointer;margin:0 6px 16px 0}a{margin-right:20px}#sample{height:450px;position:relative;border-radius:20px;overflow:hidden;margin-top:10px;border:1px solid #d1e5e32b}.backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 16%,#ecede2,transparent 55%),radial-gradient(ellipse at 25% 70%,#4f6846 0%,transparent 45%),linear-gradient(110deg,#4c6547,#a1b3a0 50%,#69816b);filter:blur(3px);transform:scale(1.05)}#glass{position:absolute;inset:2px;background:linear-gradient(130deg,#acbdb40d,transparent 60%);border-radius:20px}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#sample[data-background=night] .backdrop{background:radial-gradient(ellipse at 24% 50%,#e1b574aa,transparent 18%),radial-gradient(ellipse at 68% 36%,#acb9c9bb,transparent 14%),linear-gradient(120deg,#18252f,#243e48 55%,#09131b)}#sample[data-background=stripes] .backdrop{background:repeating-linear-gradient(90deg,#a79c70 0px,#a79c70 12px,#1c353e 12px,#1c353e 24px);filter:none;transform:none}#sample[data-background=dark] .backdrop{background:radial-gradient(ellipse at 28% 18%,#43585a,transparent 55%),linear-gradient(130deg,#28343a,#0d171d);filter:none}small{color:#91a8ad}#caption{font-size:12px;min-height:20px}@media(max-width:600px){body{padding:0 12px;margin-top:24px}#sample{height:520px}}
.backdrop i{position:absolute;top:-30%;height:160%;width:5%;background:linear-gradient(90deg,#1d39287d,#233c2b4d,transparent);transform:rotate(11deg);filter:blur(3px)}.backdrop i:nth-child(1){left:8%;width:14%}.backdrop i:nth-child(2){left:28%;width:4%}.backdrop i:nth-child(3){left:48%;width:6%}.backdrop i:nth-child(4){left:73%;width:3%;opacity:.5}.backdrop i:nth-child(5){left:92%;width:7%}#sample:is([data-background=night],[data-background=dark],[data-background=stripes]) .backdrop i{display:none}</style><body><small>SOFT & WET / RAIN MATERIAL / C</small><h1>附着、汇聚，然后流下。</h1><p>先看玻璃本身，再看真实设置窗口。背景是受控 CSS 场景，经浏览器原生 SVG 滤镜局部位移；不是实拍、游戏天气实录或物理光学仿真。</p><nav><button data-bg="day">日光</button><button data-bg="night">夜灯</button><button data-bg="dark">深色</button><button data-bg="stripes">条纹验证</button><button id="pause">静止观察</button><button id="toggle">关闭背景位移</button></nav><div id="sample"><div class="backdrop"><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="glass"><canvas></canvas></div></div><p id="caption">雨水正在附着。观察大滴与小滴、停留与流动的关系。</p><p><a href="./?candidate=glass&background=day">进入真实设置组件</a><a href="./rain-review.html">原速对照与评审</a></p><script type="module">
import{weatherSurface}from'./renderer';
const state={kind:'rain',night:false,rain:'normal'};const surface=weatherSurface(document.querySelector('canvas'),()=>state,'glass');window.rainOptics=surface;
document.querySelectorAll('[data-bg]').forEach(button=>button.onclick=()=>document.querySelector('#sample').dataset.background=button.dataset.bg);
let paused=false,enabled=true;document.querySelector('#pause').onclick=()=>{paused=!paused;surface.pause(paused);document.querySelector('#pause').textContent=paused?'继续动态':'静止观察'};
document.querySelector('#toggle').onclick=()=>{enabled=!enabled;document.querySelector('#glass').classList.toggle('no-displacement',!enabled);document.querySelector('#toggle').textContent=enabled?'关闭背景位移':'开启背景位移'};
window.addEventListener('pagehide',()=>surface.dispose(),{once:true});
</script><style>.no-displacement .evo-glass-drop{backdrop-filter:none!important}</style></body></html>
