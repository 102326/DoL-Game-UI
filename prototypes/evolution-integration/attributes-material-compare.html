<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>属性窗口 · 原速对照</title><style>
body{margin:0;padding:24px;background:#181b1d;color:#d9dfe0;font:15px/1.5 system-ui}h1{font-size:23px}a{color:#acd1c9}button,select{font:inherit;padding:8px 12px;min-height:44px;background:#293032;color:inherit;border:1px solid #667273;border-radius:8px}main{max-width:1500px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}video{width:100%;background:#101314;border-radius:12px}h2{font-size:16px}#message{color:#b4bcbf}@media(max-width:700px){.pair{grid-template-columns:1fr}body{padding:14px}}
</style></head><body><main><h1>属性窗口：原固定窗口与正式整合</h1><p>现役材质和真实属性导航；整合增加标题拖动、内芯滞后与前景同步。合成内容，同操作脚本、同视口、原速录制；两次录制不保证帧同步。</p><p><a href="./attributes-material.html?variant=baseline">操作现行窗口</a> · <a href="./attributes-material.html?variant=study">操作正式整合</a></p><p><select id="width" aria-label="对照视口"><option>1280</option><option>390</option></select> <button id="play">从头播放两版</button> <button id="pause">暂停</button></p><p id="message">读取本机录像…</p><div class="pair"><section><h2>现行窗口</h2><video id="baseline" controls muted playsinline></video></section><section><h2>正式整合（受控夹具）</h2><video id="study" controls muted playsinline></video></section></div></main><script type="module">
const videos=[document.querySelector('#baseline'),document.querySelector('#study')],message=document.querySelector('#message');
try{const response=await fetch('/tests/artifacts/ui42/attributes-material/comparison-latest.json');if(!response.ok)throw Error('尚未生成本机录像');const data=await response.json();if(!/^tests\/artifacts\/ui42\/attributes-material\/comparison-\d+$/.test(data.output))throw Error('录像目录不符合预期');const width=document.querySelector('#width');function load(){for(const [i,v]of videos.entries()){v.src='/'+data.output+'/'+width.value+'-'+(i?'study':'baseline')+'.webm';v.playbackRate=1}message.textContent=width.value+' × 900 · 1× · 雨天、拖动、栏目跳转、转雪、关闭重开'}width.onchange=load;load();document.querySelector('#play').onclick=()=>{for(const v of videos){v.currentTime=0;v.playbackRate=1;v.play().catch(e=>message.textContent=e.message)}};document.querySelector('#pause').onclick=()=>videos.forEach(v=>v.pause())}catch(e){message.textContent=e.message+'；请先执行 README 中的录制命令。'}
</script></body></html>
