name: "CI 与工程问题（CI / Engineering）"
description: "反馈 Actions、构建、打包、断言、Host 或开发文档问题 / Report CI, build, packaging, Host or tooling issues"
title: "[工程 / Engineering] "
body:
  - type: markdown
    attributes:
      value: |
        可以用简体中文或英文填写；版本不清楚可填“不知道 / Unknown”。无需翻译日志，也无须执行破坏性排查。
        Chinese or English is welcome. Unknown versions are OK; no log translation or destructive troubleshooting is required.

        可主动提供排错存档，并注明授权用于本问题的隔离复现。公开 Issue 和附件可被他人查看；不要提交密码、Token 或敏感设备标识，分享前检查截图和日志。
        You may voluntarily provide a save and authorize isolated reproduction of this issue. Public issues and attachments are visible to others; remove passwords, tokens and sensitive device identifiers.

        自动证据收集仅使用受控白名单，不读取或上传玩家存档；主动提供的存档不自动纳入公开 CI Artifact。
        Automated evidence uses a controlled allowlist and never reads or uploads player saves. Provided saves are not automatically included in public CI artifacts.
  - type: dropdown
    id: area
    attributes:
      label: "问题类型（Area）"
      options:
        - "GitHub Actions / CI"
        - "构建与打包（Build / Packaging）"
        - "测试断言或误报（Assertions / False Positive）"
        - "Framework Host"
        - "文档（Documentation）"
        - "工具与环境（Tools / Environment）"
        - "其他（Other）"
    validations:
      required: false
  - type: input
    id: commit
    attributes:
      label: "提交、分支或版本（Commit / Branch / Version）"
      placeholder: "不知道 / Unknown"
    validations:
      required: false
  - type: input
    id: ci-run
    attributes:
      label: "CI Run 链接（CI Run URL）"
      description: "可选；优先链接到具体 Run / Optional: link to the exact run"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: "执行环境（Execution Environment）"
      description: "可选：OS、Node、Python、浏览器版本及命令 / Optional: OS, Node, Python, browser versions and commands"
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: "实际问题（Actual Behavior）"
      description: "哪项检查失败、误报或未执行？ / Which check failed, misreported or did not run?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "预期结果（Expected Behavior）"
      description: "期望的检查或工程行为 / Expected check or engineering behavior"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "复现命令或步骤（Reproduction Commands / Steps）"
      description: "可选；未运行的命令请注明 / Optional; mark commands you have not run"
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: "截图、日志或存档（Screenshots, Logs or Save）"
      description: |
        可选。可拖入附件或附链接；存档请注明“允许用于本问题的隔离复现”。不要附密码或 Token。
        Optional: attach files or links. For a save, state permission for isolated reproduction of this issue. No passwords or tokens.
    validations:
      required: false
