name: Motion Evolution prototype
on:
  push:
    branches: ['prototype/golden-spin-b', 'dev/evolution-4.0', 'ci/moody-blues-*']
  pull_request:
    branches: [dev/evolution-4.0, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-spin-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
defaults:
  run:
    shell: bash
env:
  NODE_OPTIONS: --experimental-strip-types
jobs:
  prototype:
    outputs:
      manifest_sha256: ${{ steps.evidence.outputs.manifest_sha256 }}
      evidence_nonce: ${{ steps.evidence.outputs.evidence_nonce }}
      evidence_upload: ${{ steps.evidence-upload.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOODY_PROFILE: research
      MOODY_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-research
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          cache: npm
      - name: Record cache observation
        run: echo 'MOODY_NPM_CACHE_HIT=${{ steps.node.outputs.cache-hit || 'false' }}' >> "$GITHUB_ENV"
      - id: dependencies
        run: node scripts/test-ci.cjs stage dependencies
      - id: browser-install
        run: node scripts/test-ci.cjs stage browser-install
      - id: research
        name: Required controlled research contracts
        run: node scripts/test-ci.cjs research
      - id: evidence
        name: Research whole-run evidence
        if: always()
        env:
          MOODY_STEPS: ${{ toJSON(steps) }}
        run: node scripts/test-ci.cjs research-summary
      - id: evidence-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: golden-spin-prototype-${{ github.sha }}
          path: tests/artifacts/ci/${{ env.MOODY_EVIDENCE_ID }}/upload/
          if-no-files-found: error
          retention-days: 14

      - name: Record actual evidence upload outcome
        if: always()
        env:
          MOODY_UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
        run: node scripts/ci/upload-result.ts

  evidence-verify:
    needs: prototype
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOODY_PROFILE: research
      MOODY_DEVICE_DEPTH: ${{ inputs.device_depth || 'standard' }}
      MOODY_EXPECTED_NONCE: ${{ needs.prototype.outputs.evidence_nonce }}
      MOODY_MANIFEST_SHA256: ${{ needs.prototype.outputs.manifest_sha256 }}
      MOODY_PRODUCER_JOB: prototype
      MOODY_UPLOAD_OUTCOME: ${{ needs.prototype.outputs.evidence_upload }}
      MOODY_PRODUCER_RESULT: ${{ needs.prototype.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - id: evidence-download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: golden-spin-prototype-${{ github.sha }}
          path: tests/artifacts/download-evidence
      - name: Verify actual downloaded evidence
        if: always()
        env:
          MOODY_DOWNLOAD_OUTCOME: ${{ steps.evidence-download.outcome }}
        run: node scripts/ci-verify-remote.cjs tests/artifacts/download-evidence
      - name: Persist remote verification result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: moody-remote-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/artifacts/remote-verification.json
          if-no-files-found: error
          retention-days: 14
