name: Motion Evolution prototype
on:
  push:
    branches: ['prototype/golden-spin-b']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-spin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prototype:golden-spin:check && npm run ci:check
      - run: npm run prototype:golden-spin:build
      - run: npm run prototype:golden-spin:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: golden-spin-prototype-${{ github.sha }}
          path: |
            tests/artifacts/golden-spin-b/dist/**
            tests/artifacts/golden-spin-b/bundle-sizes.json
            tests/artifacts/golden-spin-b/sphere-validation-*/result.json
            tests/artifacts/golden-spin-b/sphere-validation-*/failure.json
            tests/artifacts/golden-spin-b/sphere-validation-*/*.png
            tests/artifacts/golden-spin-b/hub-validation-*/result.json
            tests/artifacts/golden-spin-b/hub-validation-*/failure.json
            tests/artifacts/golden-spin-b/hub-validation-*/*.png
          if-no-files-found: error
          retention-days: 14
