name: Motion Evolution prototype
on:
  push:
    branches: ['prototype/golden-spin-b', 'dev/evolution-4.0', 'ci/moody-blues-*']
  pull_request:
    branches: [dev/evolution-4.0, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-spin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOODY_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-research
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - id: dependencies
        run: node scripts/test-ci.cjs stage dependencies
      - id: browser-install
        run: node scripts/test-ci.cjs stage browser-install
      - id: research
        name: Required controlled research contracts
        run: node scripts/test-ci.cjs research
      - name: Research whole-run evidence
        if: always()
        env:
          MOODY_STEPS: ${{ toJSON(steps) }}
        run: node scripts/test-ci.cjs research-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: golden-spin-prototype-${{ github.sha }}
          path: tests/artifacts/ci/${{ env.MOODY_EVIDENCE_ID }}/upload/
          if-no-files-found: error
          retention-days: 14
