name: Kraft Work CI
on:
  pull_request:
    branches: [main, dev/evolution-4.0]
  push:
    branches: [main, 'ci/kraft-work-*', 'ci/moody-blues-*']
  workflow_dispatch:
    inputs:
      device_depth:
        description: Device layout coverage depth (Chromium emulation)
        type: choice
        default: standard
        options: [standard, deep]
permissions:
  contents: read
concurrency:
  group: kraft-work-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
defaults:
  run:
    shell: bash
env:
  NODE_OPTIONS: --experimental-strip-types
jobs:
  validate:
    outputs:
      manifest_sha256: ${{ steps.evidence.outputs.manifest_sha256 }}
      evidence_nonce: ${{ steps.evidence.outputs.evidence_nonce }}
      evidence_upload: ${{ steps.evidence-upload.outcome }}
    runs-on: ubuntu-latest
    # Browser installation and browser contracts each have a 12-minute stage bound.
    timeout-minutes: 35
    env:
      MOODY_PROFILE: standard
      MOODY_EVIDENCE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-validate
      MOODY_DEVICE_DEPTH: ${{ inputs.device_depth || 'standard' }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: CI gate and collaboration configuration
        run: ruby scripts/check-ci-gate.rb && ruby scripts/check-github-collaboration.rb
      - name: Record cache observation
        run: echo 'MOODY_NPM_CACHE_HIT=${{ steps.node.outputs.cache-hit || 'false' }}' >> "$GITHUB_ENV"
      - id: dependencies
        name: Locked dependencies
        run: node scripts/test-ci.cjs stage dependencies
      - id: check
        name: TypeScript and Framework contracts
        run: node scripts/test-ci.cjs stage check
      - id: unit
        name: Business and source checks
        run: node scripts/test-ci.cjs stage unit
      - id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.check.outcome == 'success' }}
        name: Build Framework and nine current packages
        run: node scripts/test-ci.cjs stage build
      - id: packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        name: ZIP contracts, negative cases and two-build comparison
        run: node scripts/test-ci.cjs stage packages
      - id: browser-install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        name: Install pinned browser
        run: node scripts/test-ci.cjs stage browser-install
      - id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser-install.outcome == 'success' }}
        name: Browser contracts, interactions, motion and compatibility
        run: node scripts/test-ci.cjs stage browser
      - id: build-artifacts
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        name: Build artifacts (not a Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kraft-work-build-${{ github.sha }}
          path: dist/ci-packages/*
          if-no-files-found: error
          retention-days: 7
      - id: evidence
        name: Moody Blues whole-run evidence
        if: always()
        env:
          MOODY_STEPS: ${{ toJSON(steps) }}
        run: node scripts/test-ci.cjs summary
      - id: evidence-upload
        name: Controlled test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kraft-work-checks-${{ github.sha }}
          path: tests/artifacts/ci/${{ env.MOODY_EVIDENCE_ID }}/upload/
          if-no-files-found: error
          retention-days: 7

      - name: Record actual evidence upload outcome
        if: always()
        env:
          MOODY_UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
        run: node scripts/ci/upload-result.ts

  moody-gate:
    needs: [validate, evidence-verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require actual validation success
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          EVIDENCE_RESULT: ${{ needs.evidence-verify.result }}
        run: |
          if [ "$VALIDATE_RESULT" != success ] || [ "$EVIDENCE_RESULT" != success ]; then
            echo "::error::validate=${VALIDATE_RESULT:-missing}; evidence=${EVIDENCE_RESULT:-missing}; refusing merge approval"
            exit 1
          fi

  evidence-verify:
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOODY_PROFILE: standard
      MOODY_DEVICE_DEPTH: ${{ inputs.device_depth || 'standard' }}
      MOODY_EXPECTED_NONCE: ${{ needs.validate.outputs.evidence_nonce }}
      MOODY_MANIFEST_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
      MOODY_PRODUCER_JOB: validate
      MOODY_UPLOAD_OUTCOME: ${{ needs.validate.outputs.evidence_upload }}
      MOODY_PRODUCER_RESULT: ${{ needs.validate.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - id: evidence-download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kraft-work-checks-${{ github.sha }}
          path: tests/artifacts/download-evidence
      - name: Verify actual downloaded evidence
        if: always()
        env:
          MOODY_DOWNLOAD_OUTCOME: ${{ steps.evidence-download.outcome }}
        run: node scripts/ci-verify-remote.cjs tests/artifacts/download-evidence
      - name: Persist remote verification result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: moody-remote-standard-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/artifacts/remote-verification.json
          if-no-files-found: error
          retention-days: 14
