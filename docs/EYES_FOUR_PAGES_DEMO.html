<style>

t:190px;width:130px}.kv{display:grid;grid-template-columns:90px 1fr;gap:10px;margin:16px 0}.kv dt{color:var(--muted)}.kv dd{margin:0}.section{padding:20px 0;border-bottom:1px solid #3b3d43}.section h2{margin-bottom:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{background:#292b30;border:1px solid #41434b}.actions button[aria-pressed=true]{background:#293946;border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.bottom{position:sticky;bottom:0;background:#202125;padding:14px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:22px;z-index:2}.summary{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted)}.pagination{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:18px}.filters{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:#dfc385}.badge{font-size:.8em;background:#353340;color:#c6bae8;padding:3px 8px;border-radius:5px}.notice{margin-top:20px;padding:12px 0;color:var(--muted);border-top:1px solid var(--line)}.empty{padding:65px 16px;text-align:center;color:var(--muted)}dialog{background:#25262a;color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(500px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}dialog::backdrop{background:#0009}.toast{position:fixed;right:18px;bottom:18px;background:#36434c;padding:14px 20px;border-radius:9px;max-width:calc(100vw - 36px);z-index:10}.hidden{display:none!important}details{margin:12px 0}summary{cursor:pointer;min-height:44px;padding:8px 0}footer.note{padding:10px 22px;color:var(--muted);font-size:13px}

.shop-detail{padding:0;overflow:hidden}.detail-body{padding:20px;max-height:max(280px,calc(100dvh - 340px));overflow:auto}.detail-body p{overflow-wrap:anywhere}.shop-model{max-width:190px;margin:22px auto 12px;text-align:center}.shop-model .figure{min-height:210px;margin:0}.shop-model button{margin-top:8px}.colour-options{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.colour-options button{min-width:44px;padding:8px;border:1px solid #555861;background:var(--swatch);color:var(--ink,#111);position:relative}.colour-options button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px;box-shadow:none}.colour-options button[aria-pressed=true]:after{content:'✓';font-weight:700}.detail-actions{padding:16px;background:#222327;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.detail-actions button{flex:1}.detail-actions label{display:flex;align-items:center;gap:8px}.detail-actions input{width:76px}.detail-description .accent{color:var(--accent)}.detail-description .price{color:#dfc385}body.large .work{grid-template-columns:1fr}

<div class="review"><strong>2.0-eyes · 交互讨论稿</strong><nav aria-label="预览页面"><button data-page="entry">① 商店入口</button><button data-page="wardrobe">② 衣柜</button><button data-page="combat">③ 战斗</button><button data-page="shop">④ 商品浏览</button></nav><label>预览字号<select id="scale"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></div>
<div class="shell"><aside><div class="avatar"><b>♟</b><span>角色示意 · 非渲染效果</span></div><div class="stat">£8,200,061 · 08:38</div><div class="stat">疼痛：感觉良好<i></i></div><div class="stat">疲劳：精神饱满<i></i></div><div class="stat">压力：心如止水<i></i></div><div class="side-nav"><span>属性</span><span>社交</span><span>日志</span><span>界面设置</span></div><p><small>侧栏保持次要层级。此处仅示意，不评审角色素材。</small></p></aside><main id="main"></main></div><footer class="note">独立离线原型 · 所有数量/价格/属性均为示例 · 不连接游戏、不写入真实存档 · 顶部四页切换仅为评审工具</footer><div class="toast hidden" role="status" id="toast"></div><dialog id="modal"><div class="bar spread"><h2 id="modal-title"></h2><button class="quiet" id="close-modal" aria-label="关闭预览弹窗">关闭</button></div><div id="modal-content"></div></dialog>
<script>
const categories=['全部','套装','上装','下装','内衣套装','内衣上装','内衣下装','头饰','面饰','颈饰','手饰','手持物','袜子','鞋子'];
const goods=[{name:'晚礼服',icon:'👗',price:120,owned:2,type:'套装'},{name:'校服衬衫',icon:'👔',price:20,owned:3,type:'上装'},{name:'睡衣衬衫',icon:'👕',price:10,owned:0,type:'上装'},{name:'长裙',icon:'👗',price:35,owned:1,type:'下装'},{name:'长靴',icon:'👢',price:60,owned:1,type:'鞋子'},{name:'短袜',icon:'🧦',price:8,owned:2,type:'袜子'}];
const clothes=[{name:'长裙',icon:'👗',type:'下装',colour:'黑色',warmth:5},{name:'校服裙',icon:'👗',type:'下装',colour:'黑色',warmth:2},{name:'百褶裙',icon:'👗',type:'下装',colour:'紫色',warmth:2},{name:'牛仔裤',icon:'👖',type:'下装',colour:'蓝色',warmth:4},{name:'校服衬衫',icon:'👔',type:'上装',colour:'白色',warmth:3},{name:'长靴',icon:'👢',type:'鞋子',colour:'棕色',warmth:5}];
let page='entry',category='全部',wardCategory='下装',worn='长裙',query='',selected=null,sort='名称',filter=false,currentPage=3;const choices={左手:'休息',右手:'休息',双脚:'休息',口部:'休息'},main=document.getElementById('main');
const figure=()=>`<div class="figure"><svg viewBox="0 0 130 190" role="img" aria-label="着装人形占位，不代表真实衣物效果"><circle cx="65" cy="30" r="20" fill="#bfc4cc"/><path d="M45 55H85L98 128H32Z" fill="#555d6b"/><path d="M47 128V176M83 128V176" stroke="#bfc4cc" stroke-width="12"/><path d="M44 60L21 111M86 60L109 111" stroke="#bfc4cc" stroke-width="10"/></svg></div>`;
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2500)}
function showModal(title,html){document.getElementById('modal-title').textContent=title;document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').showModal()}
function tabs(active,action){return `<nav class="categories" aria-label="衣物分类">${categories.map(x=>`<button data-${action}="${x}" aria-pressed="${x===active}">${x}</button>`).join('')}</nav>`}
function heading(title,subtitle,buttons=''){return `<header class="page"><div><h1>${title}</h1><p class="muted">${subtitle}</p></div><div class="bar">${buttons}</div></header>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page));
if(page==='entry')main.innerHTML=heading('服装店','一眼选择分类，直接进入商品列表','<button class="quiet" data-dialog="settings">商店设置</button>')+`<div class="warmth"><strong>保暖 9 · 外面舒适</strong><span class="muted">建议范围 5–20</span><button class="quiet" data-dialog="warmth">保暖说明</button></div><p class="muted">你在服装店内。这里的服装数不胜数。</p><section class="surface" style="margin-top:22px"><h2>选择衣物分类</h2><div class="entry-grid">${categories.map((x,i)=>`<button data-enter="${x}"><span>${['▦','♧','♙','▥'][i%4]}</span>${x}</button>`).join('')}</div></section><div class="notice">分类沿用原游戏；此预览展示示例入口，不合并内衣部位。</div><div class="bottom"><button class="quiet" data-demo="离开商店">← 离开</button><small>分类按钮一次进入，无额外确认</small></div>`;
if(page==='wardrobe'){main.innerHTML=heading('衣柜','点衣物即穿上 · 当前穿搭随之更新','<button class="quiet" data-demo="返回">← 返回</button><button class="quiet" data-dialog="manage">套装管理</button>')+`<div class="bar"><span class="muted">常用套装</span>${['便服','泳衣','睡衣1','睡衣2'].map(x=>`<button data-outfit="${x}">${x}</button>`).join('')}<button class="quiet" data-dialog="organize">整理模式</button></div><div class="work"><section>${tabs(wardCategory,'wardcat')}<div class="tools"><input id="search" type="search" placeholder="搜索当前分类衣物…" aria-label="搜索衣物" value=""><select id="sort" aria-label="排序"><option>名称</option><option>保暖</option></select></div><div class="current"><div><strong id="worn">${worn||'当前部位未穿戴'}</strong><small> · 当前部位</small></div><button data-undress>脱下当前部位</button></div><p class="muted"><small>名称 · 颜色 · 耐久 · 保暖</small></p><div id="rows" class="rows"></div></section><section class="preview" id="preview"></section></div>`;renderRows();renderWardPreview()}
if(page==='shop'){main.innerHTML=heading('服装店','紧凑商品浏览 · 原生业务资格为准','<button class="quiet" data-back>← 返回商店</button><button class="quiet" data-dialog="filter">筛选</button><button class="quiet" data-dialog="help">帮助</button>')+tabs(category,'cat')+`<div class="tools"><input id="search" type="search" placeholder="搜索商品…" aria-label="搜索商品" value=""><button class="quiet" data-clear>清空</button><select id="sort" aria-label="排序"><option>名称</option><option>价格</option></select></div><div id="filter-state"></div><div class="work"><section><div id="rows" class="rows"></div><div class="pagination"><button data-prev>上一页</button><span id="page-count">${currentPage} / 12</span><button data-next>下一页</button></div></section><section class="preview" id="detail"></section></div>`;renderRows();renderDetail();renderFilter()}
if(page==='combat'){main.innerHTML=heading('行动选择','状态 → 选择动作 → 查看摘要 → 继续')+`<div class="bar">${['可选','顺从','反抗'].map((x,i)=>`<button data-mode="${x}" aria-pressed="${!i}">${x}</button>`).join('')}</div><nav class="categories" style="margin-top:18px" aria-label="部位跳转">${Object.keys(choices).map(x=>`<button data-jump="${x}">${x}</button>`).join('')}</nav>${Object.keys(choices).map(x=>`<section class="section" id="part-${x}"><div class="bar spread"><h2>${x}</h2><label class="bar"><span class="muted">当前目标</span><select aria-label="${x}目标"><option>对手</option><option>自己</option></select></label></div><p class="muted">当前部位空闲 · 示例动作，实际资格由原游戏决定</p><div class="actions">${(x==='双脚'?['休息','踢','踢掉鞋子']:x==='口部'?['休息','紧闭嘴唇']:['休息','击打','扇耳光','防狼喷雾','遮住自己的脸']).map(a=>`<button data-action="${a}" data-part="${x}" aria-pressed="${choices[x]===a}">${a}</button>`).join('')}</div></section>`).join('')}<div class="bottom"><div id="summary" class="summary"></div><div class="bar"><button class="quiet" data-dialog="battle">战斗菜单</button><button class="primary" data-demo="继续：仅演示反馈，不执行回合">继续</button></div></div>`;renderSummary()}
const input=document.getElementById('search');if(input)input.value=query;if(input)input.addEventListener('input',()=>{query=input.value;renderRows()});const s=document.getElementById('sort');if(s){s.value=sort;s.addEventListener('change',()=>{sort=s.value;renderRows()})}}
function renderRows(){let list=(page==='wardrobe'?clothes:goods).filter(x=>(page==='wardrobe'?wardCategory==='全部'||x.type===wardCategory:category==='全部'||x.type===category)&&x.name.includes(query));if(sort==='价格')list.sort((a,b)=>a.price-b.price);if(sort==='保暖')list.sort((a,b)=>b.warmth-a.warmth);if(sort==='名称')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));document.getElementById('rows').innerHTML=list.map(x=>`<button class="row" data-item="${x.name}" aria-pressed="${page==='wardrobe'?worn===x.name:selected===x.name}"><span class="icon">${x.icon}</span><span><strong>${x.name}</strong><small>${page==='wardrobe'?`${x.colour} · 耐久100% · 保暖${x.warmth}`:`已拥有 ${x.owned} · 原生属性提示`}</small></span><span class="price">${page==='wardrobe'?(worn===x.name?'已穿戴':''): '£'+x.price}</span></button>`).join('')||'<p class="empty">没有匹配的示例衣物</p>'}
function renderWardPreview(){document.getElementById('worn').textContent=worn||'当前部位未穿戴';document.getElementById('preview').innerHTML=`<div class="bar spread"><h2>当前穿搭</h2><button class="quiet" data-dialog="zoom">放大</button></div>${figure()}<strong>${worn||'当前部位未穿戴'}</strong><p class="muted">这里只演示状态更新，不模拟角色渲染。</p><details><summary>衣物详情与特质</summary><p>原版属性和未知Mod说明应保留。本原型不生成业务数据。</p></details>`}
let demoShopMode='try',demoColour='黑色';
function renderDetail(){const x=goods.find(x=>x.name===selected);document.getElementById('detail').classList.add('shop-detail');document.getElementById('detail').innerHTML=x?`<div class="detail-body"><div class="bar spread"><h2>${x.name}</h2><span class="muted">£${x.price}</span></div><div class="detail-description"><p>一件 <span class="accent">精美</span> 且 <span class="accent">有品位</span> 的${x.name}。价格为 <strong class="price">£${x.price}</strong>。</p><p>温暖又舒适。 ❄ 6 <small>（属性示例）</small></p><h3>特质</h3><p>♧ 舒适 — 此处保留原生特质、图标与完整说明。</p></div><div class="shop-model">${figure()}<button class="quiet" data-gender aria-label="切换展示性别">切换性别：<span id="demo-gender">女性</span></button></div><p>有一系列颜色可供选择：</p><div class="colour-options" aria-label="示例颜色">${[['黑色','#242529','#eee'],['蓝色','#456cff','#fff'],['棕色','#6b3826','#fff'],['绿色','#64b532','#111'],['粉色','#e93d8d','#111'],['紫色','#9952bd','#fff'],['红色','#ed5550','#111'],['橙色','#f49a32','#111'],['青色','#40bfc1','#111'],['白色','#dedee2','#111'],['黄色','#f4d542','#111']].map(([name,colour,ink])=>`<button data-colour="${name}" aria-label="${name}" aria-pressed="${demoColour===name}" style="--swatch:${colour};--ink:${ink}" title="${name}">${demoColour===name?name:''}</button>`).join('')}</div><div class="bar"><button class="quiet" data-demo="自选颜色：只演示原生入口">⚙ 自选</button><button class="quiet" data-random-colour>⚄ 随机</button><span class="muted" id="colour-name">当前：${demoColour}</span></div><p class="muted"><small>人物是占位，颜色与性别只演示控件，不模拟渲染。</small></p><details><summary>评审用业务状态</summary><label class="bar">原生允许的操作<select id="demo-shop-mode"><option value="buy" ${demoShopMode==='buy'?'selected':''}>购买与试穿示例</option><option value="try" ${demoShopMode==='try'?'selected':''}>仅试穿示例（对应参考图）</option></select></label><p class="muted">此选择器仅供讨论，不是拟新增的游戏设置。真实操作出现条件继续由原游戏决定。</p></details></div><div class="detail-actions">${demoShopMode==='buy'?'<label>数量<input aria-label="示例购买数量" type="number" min="1" value="1"></label><button class="primary" data-demo="购买：示例反馈，未购买任何真实商品">购买</button>':''}<button data-demo="试穿：仅示例反馈">试穿</button></div>`:'<p class="empty">选择商品，查看完整原生详情与允许的操作</p>';document.getElementById('demo-shop-mode')?.addEventListener('change',e=>{demoShopMode=e.target.value;renderDetail()})}

function renderFilter(){document.getElementById('filter-state').innerHTML=filter?'<div class="filters"><span>筛选已启用（演示状态，不改商品资格）</span><button data-reset>重置筛选</button></div>':''}
function renderSummary(){document.getElementById('summary').innerHTML=Object.entries(choices).map(([k,v])=>`<span>${k}：<strong>${v}</strong></span>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.page){page=b.dataset.page;query='';sort='名称';render()}
if(b.dataset.enter){page='shop';category=b.dataset.enter;query='';selected=null;render()}
if(b.hasAttribute('data-back')){page='entry';render()}
if(b.dataset.cat){category=b.dataset.cat;selected=null;render()}
if(b.dataset.wardcat){wardCategory=b.dataset.wardcat;query='';render()}
if(b.dataset.item){if(page==='wardrobe'){worn=b.dataset.item;renderRows();renderWardPreview();toast('示例已穿上：'+worn)}else{selected=b.dataset.item;renderRows();renderDetail();if(innerWidth<=800)document.getElementById('detail').scrollIntoView({block:'start'})}}
if(b.hasAttribute('data-undress')){worn='';renderRows();renderWardPreview();toast('示例已脱下当前部位')}
if(b.dataset.outfit){worn=b.dataset.outfit+'（示例套装）';renderRows();renderWardPreview();toast('示例套装已切换')}
if(b.dataset.action){choices[b.dataset.part]=b.dataset.action;document.querySelectorAll(`[data-part="${b.dataset.part}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));renderSummary()}
if(b.dataset.jump)document.getElementById('part-'+b.dataset.jump).scrollIntoView({block:'start'});
if(b.dataset.mode){document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));toast('仅切换示例导航状态，未生成不同动作池')}
if(b.hasAttribute('data-clear')){query='';document.getElementById('search').value='';renderRows()}
if(b.hasAttribute('data-prev')||b.hasAttribute('data-next')){currentPage=Math.max(1,Math.min(12,currentPage+(b.hasAttribute('data-next')?1:-1)));document.getElementById('page-count').textContent=currentPage+' / 12';toast('示例页码变化；本样板没有12页库存')}
if(b.hasAttribute('data-reset')){filter=false;renderFilter()}
if(b.hasAttribute('data-gender')){const label=document.getElementById('demo-gender');label.textContent=label.textContent==='女性'?'男性':'女性';toast('示例性别切换，不模拟模型变化')}
if(b.dataset.colour){demoColour=b.dataset.colour;document.querySelectorAll('[data-colour]').forEach(x=>{x.setAttribute('aria-pressed',x.dataset.colour===demoColour);x.textContent=x.dataset.colour===demoColour?demoColour:''});document.getElementById('colour-name').textContent='当前：'+demoColour}
if(b.hasAttribute('data-random-colour')){const buttons=[...document.querySelectorAll('[data-colour]')];buttons[Math.floor(Math.random()*buttons.length)]?.click()}
if(b.dataset.demo)toast(b.dataset.demo);
if(b.dataset.dialog){const d=b.dataset.dialog;showModal({settings:'商店设置',warmth:'保暖说明',manage:'套装管理',organize:'整理模式',zoom:'当前穿搭',filter:'高级筛选',help:'帮助说明',battle:'战斗菜单'}[d],d==='filter'?'<p>这里只评审入口与重置的可达性，不实现原版筛选算法。</p><button id="apply-filter">启用示例筛选</button>':d==='zoom'?figure():'<p>低频功能保留明确入口。本页不实现真实管理、删除或游戏规则。</p>')}});
document.getElementById('close-modal').onclick=()=>document.getElementById('modal').close();document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='apply-filter'){filter=true;renderFilter();document.getElementById('modal').close()}});
document.getElementById('scale').onchange=e=>{document.documentElement.style.setProperty('--scale',e.target.value);document.body.classList.toggle('large',Number(e.target.value)>1)};const requestedPage=new URLSearchParams(location.search).get('page');if(['entry','wardrobe','combat','shop'].includes(requestedPage)){page=requestedPage;if(page==='shop')selected='睡衣衬衫'}render();
</script></html>
