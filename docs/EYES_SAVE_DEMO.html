<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2.0-eyes · 存档材质示例</title>
<style>
:root{color-scheme:dark;--ink:#e6e7eb;--muted:#b6b8c2;--accent:#8dc7ff;--solid:#25262a;--line:#ffffff13;--glass:rgba(37,38,42,.96);--blur:4px}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif;background:#191a1d;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 85% 18%,#5f7482,transparent 52%),radial-gradient(ellipse at 15% 85%,#735c4c,transparent 55%),#1b1c20}
body[data-background=pattern]::before{background:repeating-linear-gradient(35deg,#141518 0 45px,#e8e8e8 45px 90px)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button,input,select{min-height:44px;border-radius:9px;border:1px solid #ffffff16;background:rgba(255,255,255,.025);padding:9px 14px}button:hover{background:rgba(255,255,255,.07)}button:active{background:rgba(0,0,0,.15)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input{background:#24262a;min-width:0}button:disabled{opacity:.4;cursor:default}h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:18px}.muted{color:var(--muted)}.caption{font-size:13px;color:var(--muted)}.review{max-width:1240px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.review label{display:flex;gap:10px;align-items:center;font-size:14px}
.workspace{position:relative;max-width:1240px;margin:0 auto 24px;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.glass{background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid #ffffff18;border-top-color:#ffffff25;border-radius:18px;box-shadow:inset 0 1px #ffffff08,0 18px 48px #0005}
.manager{min-width:0;overflow:hidden;background:rgba(37,38,42,.9);--blur:8px}.titlebar{padding:24px 24px 18px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:7px}.titlebar p:last-child{margin-top:7px;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:5px;margin:0 24px 18px;padding:5px;background:#ffffff04;border-radius:11px}.tabs button{flex:1;min-width:0;background:transparent;border-color:transparent}.tabs [aria-pressed=true]{background:#ffffff08;box-shadow:inset 0 1px #ffffff12,inset 0 -2px #8dc7ff70}
.body{padding:20px 24px;background:linear-gradient(145deg,#ffffff04,transparent 60%),rgba(32,34,39,.98)}.toolbar{display:flex;gap:10px;margin-bottom:20px}.toolbar input{flex:1}.create{background:linear-gradient(145deg,#ffffff12,#ffffff04);white-space:nowrap}.group-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;font-size:13px;color:var(--muted)}
.entries{display:grid;gap:6px}.entry{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;text-align:left;align-items:center;background:#292b30;border-color:transparent;border-radius:9px;padding:12px 14px;min-height:84px}.entry .number{font-size:13px;color:var(--muted)}.entry strong{display:block;font-size:16px;font-weight:600}.entry small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.entry .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.entry[aria-pressed=true]{background:#2b3036;box-shadow:inset 2px 0 var(--accent)}.entry.auto{background:linear-gradient(145deg,#b5d6d309,transparent 60%),#292b30}.badge{font-size:11px;border-radius:5px;padding:3px 7px;background:#ffffff08;color:var(--muted)}.empty{text-align:center;padding:22px;color:var(--muted);border:1px dashed #ffffff20;border-radius:9px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 24px;font-size:12px;color:var(--muted)}
.detail{padding:0;position:sticky;top:20px;min-width:0;overflow:hidden;box-shadow:inset 0 1px #ffffff0c,0 20px 48px #0006}.detail[hidden]{display:none}.detail-head{padding:20px;display:flex;justify-content:space-between;gap:12px;align-items:center}.close{padding:8px 12px;font-size:14px}.detail-content{padding:0 20px 20px}.detail h2{font-size:22px;margin:14px 0 6px}.location{font-size:14px;color:var(--muted)}.scene{height:132px;border-radius:10px;margin:18px 0;background:radial-gradient(ellipse at 72% 28%,#bd9e6840,transparent 50%),linear-gradient(145deg,#26323e,#171c23);display:flex;align-items:end;padding:16px;color:#d8dde4;font-size:13px}.stable{background:#24262bf5;border-radius:10px;padding:14px}.stable dl{margin:0;display:grid;grid-template-columns:85px minmax(0,1fr);gap:9px;font-size:13px}.stable dt{color:var(--muted)}.stable dd{margin:0}.summary-box{margin-top:16px}.summary-box h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 8px}.summary-box p{font-size:14px;line-height:1.8}.dock{display:flex;gap:8px;padding:16px 20px;background:#ffffff04;box-shadow:inset 0 1px #ffffff09}.dock button{flex:1;padding:9px 10px;background:linear-gradient(145deg,#ffffff0c,#ffffff04)}.dock .primary{color:var(--accent);box-shadow:inset 0 -2px #8dc7ff40}.danger{color:#e3a3a3}.notice{max-width:1240px;margin:0 auto;padding:0 24px 24px;color:var(--muted);font-size:13px;min-height:44px}
dialog{max-width:calc(100vw - 32px);width:340px;color:var(--ink);padding:22px;background:var(--glass);border:1px solid #ffffff20;border-radius:16px;backdrop-filter:blur(4px);box-shadow:0 20px 60px #0007}dialog::backdrop{background:#0006}dialog p{margin-bottom:18px}dialog .actions{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:820px){.workspace{grid-template-columns:1fr}.detail{position:static}.review{padding:16px}.workspace{padding:0 16px}.body,.titlebar{padding:18px}.tabs{margin-left:18px;margin-right:18px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:180px}.entry{grid-template-columns:26px minmax(0,1fr)}.entry>.badge{display:none}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color 120ms ease}.detail{animation:appear 160ms ease-out}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
<body data-background="ambient">
<div class="review"><span>2.0-eyes · 存档示例 <span class="caption">／虚构数据，独立预览</span></span><label>对照背景<select id="background"><option value="ambient">冷暖环境</option><option value="pattern">明暗条纹</option></select></label></div>
<main class="workspace">
 <section class="manager glass" aria-label="存档管理示例">
  <header class="titlebar"><p class="eyebrow">YOUR STORY</p><h1>存档管理</h1><p>选择一个存档，查看详情与可用操作。</p></header>
  <div class="tabs" role="group" aria-label="存档功能"><button aria-pressed="true" id="saves-tab">存档</button><button  data-demo="导出／载入">导出／载入</button><button  data-demo="云存档">云存档</button></div>
  <div class="body"><div class="toolbar"><button class="create" id="create">＋ 新建示例</button><input id="search" type="search" aria-label="搜索示例存档" placeholder="搜索存档名称…"></div><div class="group-title"><span>自动存档</span><span>独立槽位</span></div><div class="entries" id="auto"></div><div class="group-title"><span>手动存档</span><span id="count"></span></div><div class="entries" id="entries"></div></div>
  <footer class="bottom"><span>所有数据仅供设计预览</span><span>1 / 1 页</span></footer>
 </section>
 <aside class="detail glass" id="detail" aria-label="存档详情"></aside>
</main>
<p class="notice" role="status" id="notice">示例中的保存、读取与删除仅影响本页模拟数据，不连接游戏。</p>
<dialog id="confirm" aria-labelledby="confirm-title"><p id="confirm-title">删除这条虚构存档？</p><div class="actions"><button id="cancel">取消</button><button class="danger" id="delete-confirm">删除示例</button></div></dialog>
<script>
const entries=[
 {id:0,name:'自动存档',date:'10月03日 02:18',place:'卧室 · 夜晚',time:'第 18 天 · 22:10',summary:'窗外传来细微的雨声。明天的安排已经准备妥当。',auto:true},
 {id:1,name:'雨后的街角',date:'10月02日 18:32',place:'街道 · 黄昏',time:'第 16 天 · 18:20',summary:'雨已经停了。街灯亮起，可以开始整理今天的收获。'},
 {id:2,name:'周末整备',date:'10月02日 21:06',place:'卧室 · 傍晚',time:'第 17 天 · 19:45',summary:'整理完衣柜和随身物品，准备迎接新的一天。'},
 {id:3,name:'夜间准备',date:'10月03日 02:12',place:'卧室 · 夜晚',time:'第 18 天 · 22:05',summary:'今天的事情已经告一段落。窗外的灯光透进房间，桌上的笔记留着明天的计划。',recent:true},
 {id:4,name:'出门之前',date:'10月02日 08:15',place:'家门口 · 清晨',time:'第 15 天 · 08:00',summary:'清晨的空气很安静，随身物品已经准备好了。'}
];
let selected=3,nextId=5;const $=id=>document.getElementById(id),say=text=>$('notice').textContent=text;
function render(){const query=$('search').value.trim();for(const [target,auto] of [['auto',true],['entries',false]]){$(target).replaceChildren();for(const item of entries.filter(e=>!!e.auto===auto&&e.name.includes(query))){const b=document.createElement('button');b.className='entry'+(auto?' auto':'');b.setAttribute('aria-pressed',String(selected===item.id));b.innerHTML='<span class="number"></span><span><strong></strong><small class="date"></small><small class="summary"></small></span><span class="badge"></span>';b.querySelector('.number').textContent=auto?'A':String(item.id).padStart(2,'0');b.querySelector('strong').textContent=item.name;b.querySelector('.date').textContent=item.date+' · '+item.place;b.querySelector('.summary').textContent=item.summary;b.querySelector('.badge').textContent=auto?'自动':item.recent?'最近保存':'手动';b.onclick=()=>{selected=item.id;$('detail').hidden=false;render()};$(target).append(b)}if(!$(target).childElementCount){const empty=document.createElement('p');empty.className='empty';empty.textContent='没有匹配的示例存档';$(target).append(empty)}}$('count').textContent=entries.filter(e=>!e.auto).length+' / 50';renderDetail()}
function renderDetail(){const item=entries.find(e=>e.id===selected);if(!item){$('detail').hidden=true;return}$('detail').innerHTML='<header class="detail-head"><span class="caption">存档详情</span><button class="close" id="close-detail">关闭详情</button></header><div class="detail-content"><span class="badge" id="detail-kind"></span><h2 id="detail-name"></h2><p class="location" id="detail-place"></p><div class="scene">场景示意 · 非游戏截图</div><div class="stable"><dl><dt>保存时间</dt><dd id="detail-date"></dd><dt>游戏内时间</dt><dd id="detail-time"></dd><dt>存档编号</dt><dd id="detail-id"></dd></dl></div><div class="summary-box"><h3>存档摘要</h3><div class="stable"><p id="detail-summary"></p></div></div></div><footer class="dock"><button id="save">保存</button><button class="primary" id="load">读取</button><button class="danger" id="delete">删除</button></footer>';for(const [id,value] of Object.entries({'detail-kind':item.auto?'自动存档':'手动存档','detail-name':item.name,'detail-place':item.place,'detail-date':item.date,'detail-time':item.time,'detail-id':item.auto?'A':String(item.id).padStart(2,'0'),'detail-summary':item.summary}))$(id).textContent=value;
 $('close-detail').onclick=()=>{$('detail').hidden=true;document.querySelector('.entry[aria-pressed=true]')?.focus()};$('load').onclick=()=>say('模拟读取「'+item.name+'」；未读取任何游戏存档。');$('save').onclick=()=>{for(const e of entries)e.recent=false;item.recent=true;item.date='刚刚 · 示例';render();say('「'+item.name+'」已更新本页示例；关闭页面后不保留。')};$('delete').onclick=()=>$('confirm').showModal()}
$('search').oninput=render;$('background').onchange=e=>document.body.dataset.background=e.target.value;$('create').onclick=()=>{entries.push({id:nextId++,name:'新的示例存档',date:'刚刚 · 示例',place:'卧室 · 夜晚',time:'第 18 天 · 22:10',summary:'这条数据仅存在于本页，用于查看新建状态。'});selected=nextId-1;$('search').value='';$('detail').hidden=false;render();say('已添加虚构存档；没有执行游戏保存。')};$('cancel').onclick=()=>$('confirm').close();$('delete-confirm').onclick=()=>{const i=entries.findIndex(e=>e.id===selected);if(i>=0)entries.splice(i,1);$('confirm').close();selected=entries[0]?.id;$('detail').hidden=false;render();document.querySelector('.entry[aria-pressed=true]')?.focus();say('已删除本页示例；没有删除真实存档。')};document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>say(b.dataset.demo+'仅为入口位置示意，本样板不访问文件或网络。'));render();
</script>
</body></html>
